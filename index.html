<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feuilles de plateau</title>
<style>
* { box-sizing: border-box; }
body { font: 14px system-ui, sans-serif; margin: 0; background: #f4f4f4; color: #222; }
header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #1a4a8a; color: #fff; }
h1 { margin: 0; font-size: 20px; } h2, h3 { margin: 0 0 8px; }
button { padding: 7px 14px; border: 1px solid #999; border-radius: 4px; background: #fff; cursor: pointer; }
button.primary { background: #e53935; color: #fff; border-color: #b71c1c; font-weight: 600; }
main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; max-width: 1000px; margin: auto; }
.col { background: #fff; padding: 14px; border-radius: 6px; }
input[type=search], label input { width: 100%; padding: 6px; margin: 4px 0 8px; }
label { display: block; font-weight: 600; margin-top: 6px; }
ul, ol { list-style: none; padding: 0; margin: 0; }
ul { max-height: 55vh; overflow: auto; border: 1px solid #ddd; }
#players li { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-bottom: 1px solid #eee; cursor: pointer; }
#players li:hover { background: #eef4ff; }
#players li.taken { color: #999; }
#players li small { margin-left: auto; color: #777; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.tabs button { flex: 1 1 64px; }
.tabs button.on { background: #1a4a8a; color: #fff; }
#roster li { display: flex; gap: 8px; padding: 4px 6px; border-bottom: 1px solid #eee; }
#roster li span.n { width: 22px; color: #888; }
#roster li button { margin-left: auto; padding: 0 8px; }
.hint { color: #777; font-size: 12px; }

/* ===== Feuille : dimensions mesurées sur le modèle « Feuille de PLATEAU U9 » ===== */
#sheet { display: none; padding: 16px; }
body.gen #sheet { display: flex; flex-wrap: wrap; gap: 3mm; justify-content: center; }
body.gen main { display: none; }
.team { width: 97mm; border-collapse: collapse; table-layout: fixed; background: #fff; color: #000; font-family: "Times New Roman", Times, serif; font-size: 16.08pt; break-inside: avoid; }
.team td, .team th { border: .25mm solid #000; padding: 0 1.5mm; overflow: hidden; white-space: nowrap; font-weight: 400; }
.team .title td { height: 7.62mm; vertical-align: top; padding-top: .9mm; border-bottom: none; }
.team .head th { height: 7.62mm; text-align: center; border-top: none; }
.team .p td { height: 6.71mm; font-size: 11.5pt; }
.team .deleg td { height: 6.71mm; font-size: 9pt; }
.team .deleg td:first-child { vertical-align: top; padding-top: .7mm; }
/* Ligne à remplir tracée à l'avance (comme sur le modèle) : le texte se pose
   dessus sans y toucher, et le trait ne s'étend pas sous le libellé. */
.team .split { display: flex; align-items: flex-end; }
.team .split b, .team .split .fill { line-height: 1; }
.team .split b { white-space: nowrap; margin-right: 1mm; }
.team .split .fill { flex: 1; min-width: 4mm; border-bottom: .25mm solid #000; padding-bottom: .7mm; overflow: hidden; white-space: nowrap; }

@page { size: A4; margin: 8mm 4mm 4mm; }
@media print {
  body { background: #fff; } .noprint { display: none !important; }
  body.gen #sheet { display: flex; padding: 0; justify-content: flex-start; gap: 3mm; }
}
.csvbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
label select{width:100%;padding:6px;margin:4px 0 8px}

/* ===== Mobile : une seule colonne, boutons plus faciles à toucher ===== */
@media screen and (max-width: 640px) {
  header { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px; }
  header h1 { text-align: center; }
  .actions { display: flex; gap: 8px; }
  .actions button { flex: 1; padding: 10px; }
  main { grid-template-columns: 1fr; max-width: 100%; padding: 10px; gap: 12px; }
  ul { max-height: 42vh; }
  #players li, #roster li { padding: 9px 8px; }
  .tabs button { padding: 9px 4px; }
  #sheet { padding: 10px 6px; }
  body.gen #sheet { flex-direction: column; align-items: center; }
}
/* Aperçu à l'écran seulement (l'impression garde la taille réelle exacte) :
   un tableau fait ~99mm ≈ toute la largeur d'un téléphone, on le réduit pour
   qu'il tienne sans avoir à faire défiler horizontalement. */
@media screen and (max-width: 430px) { body.gen .team { zoom: 0.9; } }
@media screen and (max-width: 360px) { body.gen .team { zoom: 0.8; } }
</style>
</head>
<body>
<header class="noprint">
  <h1>Feuilles de plateau</h1>
  <div class="actions">
    <button id="gen" class="primary">Générer les tableaux</button>
    <button id="print" hidden>Imprimer (taille réelle)</button>
    <button id="back" hidden>← Retour</button>
  </div>
</header>

<main id="edit" class="noprint">
  <section class="col">
    <h2>Joueurs <span id="count"></span></h2>
    <div class="csvbar">
      <button id="load">Charger players.csv</button>
      <button id="loadStaff">Charger staff.csv</button>
      <input id="fileStaff" type="file" hidden>
      <input id="file" type="file" hidden>
    </div>
    <input id="search" type="search" placeholder="Rechercher…">
    <ul id="players"></ul>
    <p class="hint">Format CSV : <code>nom;prenom;licence</code>. La licence est facultative (case vide) ou peut être une date de naissance <code>JJ/MM/AAAA</code> à la place. Liste et équipes sont mémorisées dans ce navigateur.</p>
  </section>

  <section class="col">
    <div class="tabs" id="tabs"></div>
    <h3 id="teamTitle"></h3>
    <label>Nom de l'équipe <input id="teamName" placeholder="ex. FC Metz"></label>
    <button id="clearTeam">Vider cette équipe</button> <button id="clearAll">Vider toutes les équipes</button>
    <ol id="roster"></ol>
    <label>Délégué <select id="delegue"></select></label>
  </section>
</main>

<div id="sheet"></div>
<script>
const MAX_PLAYERS = 8, LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
const $ = id => document.getElementById(id);
const blank = () => ({ nom: '', delegue: '', ids: [] });
let players = [], staff = [], teams = LETTERS.map(blank), cur = 0;

const key = p => p.licence || p.id;   // identifiant stable : la licence si connue, sinon un id de secours (pas de licence obligatoire)
const label = p => `${p.nom.toUpperCase()} ${p.prenom}`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const escFill = s => esc(s) || '&nbsp;';   // un span totalement vide n'a pas la même hauteur de ligne qu'un span avec contenu
const teamOf = k => teams.findIndex(t => t.ids.includes(k));
const byName = (a, b) => label(a).localeCompare(label(b));

/* ---- stockage local (navigateur) ---- */
function save() { try { localStorage.setItem('fdm', JSON.stringify({ players, staff, teams })); } catch {} }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('fdm') || '{}');
    if (Array.isArray(d.players)) players = d.players;
    if (Array.isArray(d.staff)) staff = d.staff;
    if (Array.isArray(d.teams) && d.teams.length === LETTERS.length) teams = d.teams;
  } catch {}
}

/* ---- CSV : nom;prenom;licence (players.csv et staff.csv ont le même format) ---- */
function parseCsv(txt, prefix) {
  const lines = txt.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];
  const sep = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ';' : ',';
  return lines.slice(1).map((l, i) => {
    const [nom = '', prenom = '', licence = ''] = l.split(sep).map(s => s.trim());
    return { id: prefix + i, nom, prenom, licence };
  }).filter(p => p.nom || p.prenom);
}

$('load').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  players = parseCsv(await f.text(), 'j').sort(byName);
  teams.forEach(t => { t.ids = t.ids.filter(k => players.some(p => key(p) === k)); });
  e.target.value = ''; save(); render();
};
$('loadStaff').onclick = () => $('fileStaff').click();
$('fileStaff').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  staff = parseCsv(await f.text(), 's').sort(byName);
  teams.forEach(t => { if (!staff.some(p => key(p) === t.delegue)) t.delegue = ''; });
  e.target.value = ''; save(); render();
};

/* ---- rendu ---- */
function renderPlayers() {
  const q = $('search').value.toLowerCase();
  $('count').textContent = `(${players.length})`;
  $('players').innerHTML = players.filter(p => (label(p) + p.licence).toLowerCase().includes(q)).map(p => {
    const t = teamOf(key(p));
    return `<li data-k="${esc(key(p))}" class="${t >= 0 ? 'taken' : ''}"><span>${esc(label(p))}</span><small>${esc(p.licence)}${t >= 0 ? ' · Éq. ' + LETTERS[t] : ''}</small></li>`;
  }).join('') || '<li>Aucun joueur : charge un CSV avec le bouton ci-dessus.</li>';
}
function renderTeam() {
  const t = teams[cur];
  $('tabs').innerHTML = LETTERS.map((l, i) => `<button data-i="${i}" class="${i === cur ? 'on' : ''}">Éq. ${l} (${teams[i].ids.length})</button>`).join('');
  $('delegue').innerHTML = '<option value="">—</option>' + staff.map(p => `<option value="${esc(key(p))}"${key(p) === t.delegue ? ' selected' : ''}>${esc(label(p))}</option>`).join('');
  $('teamName').value = t.nom;
  $('teamTitle').textContent = `Équipe ${LETTERS[cur]} — ${t.ids.length}/${MAX_PLAYERS}`;
  $('roster').innerHTML = t.ids.map((k, i) => {
    const p = players.find(x => key(x) === k); if (!p) return '';
    return `<li><span class="n">${i + 1}</span><span class="name">${esc(label(p))}</span><small>${esc(p.licence)}</small>
      <button data-rm="${esc(k)}">×</button></li>`;
  }).join('');
}
const render = () => { renderPlayers(); renderTeam(); };

$('players').onclick = e => {
  const li = e.target.closest('li[data-k]'); if (!li) return;
  const k = li.dataset.k, t = teams[cur], prev = teamOf(k);
  if (prev === cur) return;
  if (prev >= 0) return alert(`Ce joueur est déjà dans l'équipe ${LETTERS[prev]} : retire-le d'abord.`);
  if (t.ids.length >= MAX_PLAYERS) return alert(`Maximum ${MAX_PLAYERS} joueurs par équipe.`);
  t.ids.push(k); save(); render();
};
$('roster').onclick = e => {
  const t = teams[cur], d = e.target.dataset;
  if (!d.rm) return;
  t.ids = t.ids.filter(x => x !== d.rm);
  save(); render();
};
$('tabs').onclick = e => { if (e.target.dataset.i) { cur = +e.target.dataset.i; renderTeam(); } };
$('teamName').oninput = () => { teams[cur].nom = $('teamName').value; save(); };
$('delegue').onchange = () => { teams[cur].delegue = $('delegue').value; save(); };
$('search').oninput = renderPlayers;
$('clearTeam').onclick = () => {
  if (!confirm(`Vider l'équipe ${LETTERS[cur]} ?`)) return;
  teams[cur] = blank(); save(); render();
};
$('clearAll').onclick = () => {
  if (!confirm('Vider toutes les équipes ?')) return;
  teams = LETTERS.map(blank); save(); render();
};

/* ---- génération : un tableau par équipe, à la taille du modèle « Feuille de PLATEAU U9 » ---- */
function teamTable(t) {
  const deleg = staff.find(x => key(x) === t.delegue);
  const rows = Array.from({ length: MAX_PLAYERS }, (_, n) => {
    const p = players.find(x => key(x) === t.ids[n]);
    return `<tr class="p"><td>${n + 1} ${p ? esc(label(p)) : ''}</td><td>${p ? esc(p.licence) : ''}</td></tr>`;
  }).join('');
  return `<table class="team">
    <colgroup><col style="width:55mm"><col style="width:42mm"></colgroup>
    <tr class="title"><td colspan="2"><div class="split"><b>Equipe :</b><span class="fill">${escFill(t.nom)}</span></div></td></tr>
    <tr class="head"><th>Nom Prénom</th><th>N° Licence</th></tr>
    ${rows}
    <tr class="deleg"><td><div class="split"><b>Délégué :</b><span class="fill">${deleg ? esc(label(deleg)) : '&nbsp;'}</span></div></td><td>${deleg ? esc(deleg.licence) : ''}</td></tr>
  </table>`;
}
$('gen').onclick = () => {
  const used = teams.filter(t => t.ids.length || t.nom || t.delegue);
  if (!used.length) return alert('Aucune équipe renseignée.');
  $('sheet').innerHTML = used.map(teamTable).join('');
  document.body.classList.add('gen');
  $('gen').hidden = true; $('print').hidden = false; $('back').hidden = false;
};
$('back').onclick = () => { document.body.classList.remove('gen'); $('gen').hidden = false; $('print').hidden = true; $('back').hidden = true; };
$('print').onclick = () => window.print();

/* ---- au démarrage : reprend la sauvegarde du navigateur, ou essaie de charger
   players.csv / staff.csv s'ils sont à côté de la page (utile quand la page
   est hébergée en ligne ; échoue silencieusement sinon, il reste le bouton "Charger"). */
load(); render();   // affiche tout de suite ce qui est déjà mémorisé dans ce navigateur
(async () => {
  let changed = false;
  if (!players.length) {
    try { const r = await fetch('players.csv'); if (r.ok) { players = parseCsv(await r.text(), 'j').sort(byName); changed = true; } } catch {}
  }
  if (!staff.length) {
    try { const r = await fetch('staff.csv'); if (r.ok) { staff = parseCsv(await r.text(), 's').sort(byName); changed = true; } } catch {}
  }
  if (changed) render();
  if (location.hash === '#gen') $('gen').click();
})();
</script>
</body>
</html>
